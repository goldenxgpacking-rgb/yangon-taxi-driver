name: yangon_taxi_driver
description: "Yangon Taxi Driver App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8

  # 安全存储
  flutter_secure_storage: ^8.0.0

  # 权限管理
  permission_handler: ^11.3.1

  # 文件 & 图片
  path_provider: ^2.1.1
  image_picker: ^1.1.2

  # 状态管理 & 存储
  provider: ^6.1.1
  shared_preferences: ^2.3.2

  # 网络 & 工具
  http: ^1.1.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0

  # OTP 自动填入
  sms_autofill: ^2.4.1
  pin_code_fields: ^8.0.1

  # 多语言
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
