name: yangon_taxi_driver
description: "Yangon Taxi Driver App - Driver side application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: "^3.12.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <1.0.0"
  
  # State & Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.2
  
  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  
  # OTP & Auth
  sms_autofill: ^2.4.1
  pin_input_text_field: ^4.5.2
  
  # Utilities
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.3
  
  # Networking
  http: ^1.1.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # Assets (if needed later)
  # assets:
  #   - assets/images/
