name: yangon_taxi_driver
description: "Yangon Taxi Driver App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 核心UI
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  
  # 状态管理
  shared_preferences: ^2.3.2
  provider: ^6.1.1
  
  # 地图与定位
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  
  # OTP
  sms_autofill: ^2.4.1
  pin_input_text_field: ^4.5.2
  
  # 网络
  http: ^1.0.0
  
  # 多语言
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
